name: Publish to Steam Workshop

# Manual only, on purpose: this project gates Workshop publication on a native
# verification round (see docs/workshop-release.md). Auto-publishing on every
# merge to main would skip that check. Run this by hand once a release is ready.
on:
  workflow_dispatch:
    inputs:
      change_note:
        description: "Workshop change note for this update"
        required: true
        default: "See CHANGELOG.md"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build the Workshop package
        id: package
        run: |
          set -e
          output="$(python tools/package_workshop.py)"
          echo "$output"
          folder="$(echo "$output" | grep '^Folder:' | sed 's/^Folder: //')"
          echo "folder=$folder" >> "$GITHUB_OUTPUT"

      - name: Install steamcmd
        run: |
          sudo add-apt-repository -y multiverse
          sudo dpkg --add-architecture i386
          echo steam steam/question select "I AGREE" | sudo debconf-set-selections
          echo steam steam/license note '' | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y steamcmd

      # Headless login needs a Steam Guard session that has already been approved once.
      # See docs/workshop-release.md for how to produce STEAM_LOGIN_CACHE.
      - name: Restore Steam login cache
        run: |
          mkdir -p "$HOME/Steam/config"
          echo "${{ secrets.STEAM_LOGIN_CACHE_B64 }}" | base64 -d > /tmp/steam-config.tar.gz
          tar -xzf /tmp/steam-config.tar.gz -C "$HOME/Steam/config"

      - name: Build the item VDF
        run: |
          sed \
            -e "s#__CONTENT_FOLDER__#${{ steps.package.outputs.folder }}#" \
            -e "s#__PREVIEW_FILE__#${{ github.workspace }}/preview.png#" \
            -e "s#__CHANGE_NOTE__#${{ inputs.change_note }}#" \
            tools/workshop_item.vdf.template > /tmp/workshop_item.vdf
          cat /tmp/workshop_item.vdf

      - name: Upload to Workshop
        run: |
          /usr/games/steamcmd \
            +login "${{ secrets.STEAM_USERNAME }}" "${{ secrets.STEAM_PASSWORD }}" \
            +workshop_build_item /tmp/workshop_item.vdf \
            +quit
